name: tests

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:

jobs:
  grounding-layers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: install soft deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib scipy psutil
      - name: grounding-layers audit-grade suite
        run: python -m unittest discover -s grounding-layers -p 'test_*.py'

  simulator-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: substrate-emergence
        run: python -m unittest discover -s substrate-emergence/tests -p 'test_*.py'
      - name: continuity-audit
        run: python -m unittest discover -s continuity-audit/tests -p 'test_*.py'
      - name: emergence-stability-simulator
        run: python -m unittest discover -s emergence-stability-simulator/tests -p 'test_*.py'
      - name: incentive-blindspot-sim
        run: python -m unittest discover -s incentive-blindspot-sim -p 'test_*.py'
      - name: antifungal-mechanism-sim
        run: python -m unittest discover -s antifungal-mechanism-sim/tests -p 'test_*.py'
      - name: enclosure-first-residual
        timeout-minutes: 5   # stalled about 46 min in run #1876; local time 3.3 s (studies/ci/STALL_1876.md)
        run: python -m unittest discover -s enclosure-first-residual/tests -p 'test_*.py'
      - name: threshold-states interaction (canonical)
        run: python -m unittest discover -s threshold-states -p 'test_*.py'
      - name: tools/narrative_check (moved from AI-Consciousness-Sensors healing/)
        run: |
          python tools/narrative_check.py --selftest
          python -m unittest tests.test_narrative_check -v
      - name: tools/check_cards (TOOL_CARDS index; a row whose pinned commit is not in this checkout reads NOT_CHECKED)
        run: |
          python tools/check_cards.py --selftest
          python tools/check_cards.py
