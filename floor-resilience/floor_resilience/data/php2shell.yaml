# own advisory page was not opened from the build sandbox. Re-check against
# php.net before relying on any version number below.
name: PHP2Shell
cves: [CVE-2026-109618, CVE-2026-109619]
cvss_v4: 9.2
authentication_needed: false
summary: >-
  Two PHP core flaws allowing unauthenticated remote code execution on PHP
  installs that serve web requests. Risk stated as highest for mod_php.
dates:
