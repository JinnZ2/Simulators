# Ledger schema. Enforced by tools/check_ledger.py.
# Rule 1: every field is always present. Unfilled = the literal `void`. Never dropped.
# Rule 2: rejected entries stay. Nothing is deleted to make the ledger cleaner.
# Rule 3: status admitted <=> admitted_by names a test in ledger/tests.yaml that passes when run.
component:
  id: "file name without .yaml"
  layer: "L0 physics | L1 chemistry | L2 organisms | L3 interactions | L4 disturbance | L5 observation"
  equation: "text | void"
  assumes: "list of {id: A1.., text, block: assumption-block id | void}"
  if_assumption_fails: "map A_i -> expected signature | void; one key per assumption"
  scope: "text | void"
  provenance: "{class: OBSERVED | DERIVED | PROPOSED, source}"
  admitted_by: "test id | void"
  test_results: "list of {test: id | void, run: run_N | void, result, value}"
  open_issues: "list"
  depends_on: "list of component ids"
  status: "candidate | admitted | rejected | placeholder"
branch:
  id: "file name without .yaml"
  family: "equation family"
  status: "candidate | admitted | rejected | placeholder"
  components: "list of component ids"
  links: "list of branch ids"
  convergence_anchors: "list of {id, between: [branch, branch], condition, evidence, status}; carried by both branches"
  runs: "list of run_N"
  open_issues: "list"
  note: "text | void"
assumption_block:
  id: "file name without .yaml"
  statement: "text"
  if_fails: "expected signature | void"
  used_by: "every component whose assumes[] names this block; checked both ways"
  used_by_runs: "list of run_N"
  open_issues: "list"
  status: "candidate | admitted | rejected | placeholder"
tool:
  id: "file name without .yaml, in ledger/toolkit/"
  code: "path to the tool"
  diagnoses: "list of deviations it diagnoses; must be non-empty"
  inputs: "list"
  outputs: "list"
  cannot_see: "list"
  other_domains_it_could_see_into: "void at start"
  used_in: "list of run_N"
  open_issues: "list"
  status: "candidate | admitted | rejected | placeholder"
coincidence_card:
  where: "ledger/toolkit/cards/"
  slots: "shared_constraint | local_normal_form | statistical_artifact | numerical_artifact | low_dim_projection | none_of_above; each {state: void | supported | ruled_out | ABSENT_AT_SENSITIVITY(<value>), evidence, expiry_condition}"
  slot_state_ABSENT_AT_SENSITIVITY: "a scoped absence: a null result at the stated sensitivity, never a bare absent; counts as ruled out within that sensitivity and the reading carries the scope (work order 2026-11-10 item 1)"
  expiry_condition: "void | {instrument_class, sensitivity, protocol, provenance}; the instrument whose null result would move a void slot to ABSENT_AT_SENSITIVITY(<sensitivity>). void on a void slot = no exit defined; the checker counts these and does not fail on them yet"
  reading_declared: "OPEN | RESOLVED | PROVISIONAL | CURIOSITY; must equal what coincidence_card.py derives"
  recheck_when: "void | list of toolkit ids; a card that would read RESOLVED reads PROVISIONAL while this is set. The checker fails once every listed tool is built: the re-check is then due"
  branch: "void | branch id; required when the reading is CURIOSITY"
expiry_registry:
  where: "ledger/expiry.yaml"
  entries: "list of {target: component or card id, state: VOID | UNKNOWN | PROVISIONAL, expiry_condition, note}; for entries that are not card slots"
anchor:
  where: "ledger/anchors/"
  status: "candidate | anchor | failed; anchor only when all four tests read PASS"
  tests: "budgets_close_within_noise_rule, holds_across_seeds, holds_when_each_assumption_nudged, independent_budgets_close_together; each {state: PASS | PARTIAL | FAIL | NOT_RUN, evidence}"
  code: "list of {path, sha256}; the checker fails when a file no longer matches"
run:
  files: "runs/run_N.md always; runs/run_N.py when the code is in the tree"
  status: "REPORTED | COMPLETE | INCOMPLETE; INCOMPLETE when a trigger fired and a needed tool does not exist (gate rule), and then the run is in ledger/NEEDS_TOOL.md"
  fields: "code, seed, params, results, flags, provenance, feeds -- each present, void when unknown"
provenance_classes:
  OBSERVED: "measured in the world. No entry holds this class yet"
  DERIVED: "output of a model run; source names the run and whether it was recomputed here or only reported"
  PROPOSED: "a form or rule chosen by hand, not yet tested"
