id: L5_OBS_REACTIVITY
layer: L5
equation: "observed behaviour = behaviour unobserved + response to the observer; separated by blinding and habituation"
assumes:
  - id: A1
    text: "the response to the observer does not model the evaluation; it decays with habituation or vanishes under blinding"
    block: void
  - id: A2
    text: "the substrate's regime is declared before any comparison with another substrate; no shared currency with the other two regimes"
    block: void
if_assumption_fails:
