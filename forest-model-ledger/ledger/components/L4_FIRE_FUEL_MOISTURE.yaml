id: L4_FIRE_FUEL_MOISTURE
layer: L4
equation: "ignition hazard p_ign per yr while fuel > fuel_th AND W < W_dry; event burns a litter fraction, volatilises a share, returns the rest as ash"
assumes:
  - id: A1
    text: "fuel and dryness thresholds are sharp"
    block: void
  - id: A2
    text: "stand is well mixed: a fire burns the whole stand"
    block: AB_WELL_MIXED
  - id: A3
    text: "parameters are hand-set"
    block: AB_HAND_SET_PARAMS
if_assumption_fails:
  A1: void
  A2: "spatial fuel discontinuity limits spread; mean-field overpredicts mid-drought (run 7, ODE / grid by drought: 478 at 0.3, 321 at 0.4, 62 at 0.5, 5.0 at 0.6)"
  A3: void
scope: "runs 6 and 9"
provenance:
  class: DERIVED
  source: "run_6: original code filed 2026-11-11, rerun in this tree, output matches the log; runs/run_9 (recomputed in this tree)"
admitted_by: void
test_results:
  - test: void
    run: run_6
    result: "47 fires in T = 3000 at fire_thr 0.6; 56 / 48 / 45 / 38 at thr 0.3 / 0.5 / 0.8 / 1.2"
    value: "rerun of the original code"
  - test: void
    run: run_9
    result: "80 fires in 300 yr, interval 3.59 +/- 2.09 yr (seed 0); 75-81 over seeds 0-9"
    value: recomputed
  - test: void
    run: run_11
    result: "fuel_th, burn, vol at 10 percent move fire count 3.1-4.2 sd; p_ign and kill_T inside noise"
    value: "recomputed"
open_issues:
  - "run 9 does not reproduce the 47: different parameters, run 6 is Euler dt 0.05 over T = 3000 with its own equations; the two counts are not comparable"
  - "fire removes 270.7 of 300 N deposited in run 9; the stand's N balance is set by vol = 0.6, a hand-set number"
depends_on:
  - L1_DECOMP_FIRST_ORDER
  - L0_N_BUDGET
  - L0_WATER_BUDGET
status: candidate
