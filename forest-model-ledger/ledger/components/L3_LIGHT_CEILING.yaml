id: L3_LIGHT_CEILING
layer: L3
equation: "growth multiplied by max(0, 1 - (B_self + a * B_other) / K_light)"
assumes:
  - id: A1
    text: "a ceiling exists and is set by light"
    block: void
  - id: A2
    text: "parameters are hand-set"
    block: AB_HAND_SET_PARAMS
if_assumption_fails:
  A1: "without a ceiling mutualism runs away (run 4)"
  A2: void
scope: "run 4 sweep; base model"
provenance:
